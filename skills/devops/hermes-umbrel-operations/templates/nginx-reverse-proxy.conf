# ============================================================================
# Nginx Reverse Proxy for Hermes Agent (Ubuntu Migration)
# Generated from /opt/data/hermes-migration/nginx.conf
# Use with docker-compose.yml nginx service block or native Ubuntu systemd
# Features: Dashboard HTTP, Chat WebSocket, Gateway WS, healthcheck, rate limiting
# ============================================================================

upstream hermes_dashboard {
    server hermes:9119;                 # Docker Compose service name
    # server localhost:9119;           # For native install
    keepalive 32;
}

upstream hermes_gateway {
    server hermes:18790;                # If exposing gateway separately
    # server localhost:18790;          # For native install
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ---- HTTP → HTTPS redirect + ACME challenge ----
server {
    listen 80;
    listen [::]:80;
    server_name hermes.seudominio.com;  # EDIT THIS

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$server_name$request_uri; }
}

# ---- HTTPS server ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hermes.seudominio.com;  # EDIT THIS

    ssl_certificate     /etc/letsencrypt/live/hermes.seudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hermes.seudominio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: wss: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https: data:; img-src 'self' https: data: blob:; connect-src 'self' https: wss:;" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml application/wasm;

    client_max_body_size 50M;

    # Healthcheck (no rate limit, public)
    location = /health {
        access_log off;
        proxy_pass http://hermes_dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Metrics (internal only)
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://hermes_dashboard;
    }

    # Dashboard — HTTP/HTTPS main
    location / {
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 100;

        proxy_pass http://hermes_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
        proxy_buffering off;              # Critical for SSE/streaming
        proxy_request_buffering off;
        proxy_cache off;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Chat WebSocket (/api/pty, /api/ws, /api/pub, /api/events)
    location ~ ^/(api/(pty|ws|pub|events)) {
        limit_req zone=ws_limit burst=20 nodelay;
        limit_conn conn_limit 50;

        proxy_pass http://hermes_dashboard;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 86400s;       # 24h for persistent chat
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }

    # Gateway WebSocket (optional, if exposing port 18790)
    location /gateway/ {
        limit_req zone=ws_limit burst=20 nodelay;
        proxy_pass http://hermes_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # Static assets (aggressive caching)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm|map)$ {
        proxy_pass http://hermes_dashboard;
        proxy_cache_valid 200 302 1y;
        proxy_cache_valid 404 1m;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Block sensitive paths
    location ~ ^/(config|auth|state\.db|\.env|logs/|scripts/|migrations/) {
        deny all;
        return 404;
    }
}